name: Build VPO

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Compile against KSP 1.12.5
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          ksp-zip-url: https://github.com/KSPModdingLibs/KSPLibs/raw/main/KSP-1.12.5.zip

      - name: Verify plugin output
        run: test -f GameData/VesselPhysicsOptimizer/Plugins/VesselPhysicsOptimizer.dll

      - name: Package GameData
        run: |
          mkdir -p dist
          cp -R GameData dist/GameData
          cp README.md dist/README.md
          cd dist
          zip -r ../VesselPhysicsOptimizer-0.1.0.zip .

      - name: Package CKAN metadata repository
        run: zip -j VesselPhysicsOptimizer-CKAN-Metadata.zip VesselPhysicsOptimizer-0.1.0.ckan

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VesselPhysicsOptimizer-KSP-1.12.5
          path: |
            VesselPhysicsOptimizer-0.1.0.zip
            VesselPhysicsOptimizer-CKAN-Metadata.zip

      - name: Publish CKAN-downloadable release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: Vessel Physics Optimizer 0.1.1
          target_commitish: ${{ github.sha }}
          files: |
            VesselPhysicsOptimizer-0.1.0.zip
            VesselPhysicsOptimizer-CKAN-Metadata.zip
          fail_on_unmatched_files: true
          make_latest: true
