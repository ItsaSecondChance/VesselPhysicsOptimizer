name: Build VPO

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '*.ckan'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Compile against KSP 1.12.5
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          build-configuration: Release
          solution-file-path: VesselPhysicsOptimizer.csproj

      - name: Package GameData
        shell: bash
        run: |
          set -euo pipefail
          test -f GameData/VesselPhysicsOptimizer/Plugins/VesselPhysicsOptimizer.dll
          mkdir -p dist
          zip -r dist/VesselPhysicsOptimizer-0.2.0.zip GameData/VesselPhysicsOptimizer
          unzip -t dist/VesselPhysicsOptimizer-0.2.0.zip
          sha256sum dist/VesselPhysicsOptimizer-0.2.0.zip
          stat -c 'ZIP size: %s bytes' dist/VesselPhysicsOptimizer-0.2.0.zip

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: VesselPhysicsOptimizer-0.2.0-test
          path: dist/VesselPhysicsOptimizer-0.2.0.zip
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Vessel Physics Optimizer 0.2.0
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/VesselPhysicsOptimizer-0.2.0.zip
          body: |
            Experimental native physics aggregation for KSP 1.12.5.3190.
            Aggregation is disabled by default; press F8 to enable it in a backed-up test save.
            F9 toggles debug colors and F10 toggles diagnostics.
            This build has not yet been validated in a live game session.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}