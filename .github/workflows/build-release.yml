name: Build VPO

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '*.ckan'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Compile against KSP 1.12.5
        uses: KSPModdingLibs/KSPBuildTools/.github/actions/compile@1.1.1
        with:
          build-configuration: Release
          solution-file-path: VesselPhysicsOptimizer.csproj

      - name: Package GameData
        shell: bash
        run: |
          set -euo pipefail
          test -f GameData/VesselPhysicsOptimizer/Plugins/VesselPhysicsOptimizer.dll
          mkdir -p dist
          zip -r dist/VesselPhysicsOptimizer-0.2.0.zip GameData/VesselPhysicsOptimizer
          unzip -t dist/VesselPhysicsOptimizer-0.2.0.zip
          sha256sum dist/VesselPhysicsOptimizer-0.2.0.zip
          stat -c 'ZIP size: %s bytes' dist/VesselPhysicsOptimizer-0.2.0.zip

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: VesselPhysicsOptimizer-0.2.0-test
          path: dist/VesselPhysicsOptimizer-0.2.0.zip
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Vessel Physics Optimizer 0.2.0
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: dist/VesselPhysicsOptimizer-0.2.0.zip
          body: |
            Experimental native physics aggregation for KSP 1.12.5.3190.
            Aggregation is disabled by default; press F8 to enable it in a backed-up test save.
            F9 toggles debug colors and F10 toggles diagnostics.
            This build has not yet been validated in a live game session.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh CKAN metadata from the released ZIP
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          old_path = Path("VesselPhysicsOptimizer-0.1.0.ckan")
          new_path = Path("VesselPhysicsOptimizer-0.2.0.ckan")
          archive = Path("dist/VesselPhysicsOptimizer-0.2.0.zip")

          metadata = json.loads(old_path.read_text(encoding="utf-8"))
          metadata["abstract"] = "Experimental opt-in native physics aggregation for KSP 1.12.5."
          metadata["version"] = "0.2.0"
          metadata["download"] = "https://github.com/ItsaSecondChance/VesselPhysicsOptimizer/releases/download/v0.2.0/VesselPhysicsOptimizer-0.2.0.zip"
          metadata["release_status"] = "testing"
          metadata["download_size"] = archive.stat().st_size
          metadata["download_content_type"] = "application/zip"
          metadata["download_hash"] = {
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest().upper()
          }

          new_path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          old_path.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- VesselPhysicsOptimizer-0.1.0.ckan VesselPhysicsOptimizer-0.2.0.ckan
          if ! git diff --cached --quiet; then
            git commit -m "Update CKAN metadata for VPO 0.2.0"
            git push origin HEAD:main
          fi
